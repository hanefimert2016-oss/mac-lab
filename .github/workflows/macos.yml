name: Apple_M1_Deep_Analysis
on: workflow_dispatch

jobs:
  analyze:
    runs-on: macos-latest
    steps:
    - name: Islemciyi_Sorgula
      run: |
        echo "--- CEKIRDEK SAYISI ---"
        sysctl hw.ncpu
        echo "--- RAM MIKTARI (Byte) ---"
        sysctl hw.memsize
        echo "--- ISLEMCI MIMARISI ---"
        uname -m
        echo "--- MODEL BILGISI ---"
        sysctl hw.model
    - name: Performans_Testi
      run: |
        echo "Islemci 5 saniye boyunca terletiliyor..."
        yes > /dev/null & sleep 5 && kill $!
        echo "Test bitti!"
