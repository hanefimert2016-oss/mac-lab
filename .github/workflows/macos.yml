name: MacOS_Direct_Access
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: MacOS_Sistemini_Tani
      run: |
        echo "--- Islemci Detaylari ---"
        sysctl -a | grep machdep.cpu.brand_string
        echo "--- macOS Versiyonu ---"
        sw_vers
        echo "--- Disk Durumu ---"
        df -h
        
    - name: Kendi_Komutunu_Yaz
      run: |
        # Buraya istedigin komutu yazabilirsin
        echo "Sistem su an senin emrinde!"
        # Ornegin: bir dosya olusturalim
        echo "Main Processor Tasarimi v1.0" > hayalim.txt
        cat hayalim.txt
